site_name: FoodBack
site_description: Documentação oficial do projeto FoodBack
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/food
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.integrate

  name: material
nav:
  - Início: index.md
  - Descrição Geral: descricao.md
  - Problema Identificado: problema.md
  - Justificativa: justificativa.md
  - Público-Alvo / Usuários: publico-alvo.md
  - Concorrentes: concorrentes.md
  - Solução / Funcionamento: solucao.md
  - Mapa de Empatia: empatia.md
  - Jornada do Usuário:
      - Empresa Doadora: jornada-empresa.md
      - ONG Receptora: jornada-ong.md
  - Tecnologias Utilizadas: tecnologias.md
  - Requisitos:
      - Funcionais e Não Funcionais: requisitos.md
  - Simulador Financeiro: financeiro.md
  - Visão de Futuro: futuro.md
 